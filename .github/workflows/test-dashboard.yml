name: Dashboard tests

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'tests/**'
      - '.github/workflows/test-dashboard.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'tests/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: test-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-driver-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + Chromium
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run verify driver-scope tests
        working-directory: tests
        run: node verify-driver-scope.spec.mjs
